name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so upstream deprecations and releases surface on their own.
    - cron: '0 6 * * 1'

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint-skills:
    name: Lint Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install SDK type stubs
        run: npm install --no-save @0gfoundation/0g-storage-ts-sdk@^1.2.12 @0gfoundation/0g-compute-ts-sdk@^0.9.0 @0gfoundation/0g-agenticid-sdk@^0.1.6 ethers@6.13.1 viem@^2.21.0
      - name: Extract and type-check code blocks
        run: npm run ci:extract
      - name: Validate SDK versions
        run: npm run ci:versions
      - name: Lint critical rules
        run: npm run ci:lint
      - name: Validate manifests against filesystem
        run: npm run ci:manifests

  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [file-vault, ai-chatbot, nft-with-metadata, ai-image-gallery]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and type-check ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          npm install
          npx tsc --noEmit

  sdk-freshness:
    name: SDK Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Every package this repo teaches must still be supported upstream.
      # The predecessors (@0glabs/0g-ts-sdk, @0glabs/0g-serving-broker) were
      # deprecated and renamed, and nothing here noticed for months.
      - name: Fail if any pinned SDK is deprecated
        run: |
          set -euo pipefail
          status=0
          for pkg in @0gfoundation/0g-storage-ts-sdk @0gfoundation/0g-compute-ts-sdk @0gfoundation/0g-agenticid-sdk ethers viem; do
            msg="$(npm view "$pkg" deprecated 2>/dev/null || true)"
            if [ -n "$msg" ]; then
              echo "::error::$pkg is DEPRECATED upstream: $msg"
              status=1
            else
              echo "ok: $pkg is not deprecated"
            fi
          done
          exit $status
      - name: Warn if a newer SDK version is published
        run: |
          set -euo pipefail
          check() {
            pinned="$2"
            latest="$(npm view "$1" version)"
            if [ "$latest" != "$pinned" ]; then
              echo "::warning::$1 pinned at $pinned but $latest is published"
            else
              echo "ok: $1 is at the latest version ($latest)"
            fi
          }
          check @0gfoundation/0g-storage-ts-sdk 1.2.12
          check @0gfoundation/0g-compute-ts-sdk 0.9.0
          check @0gfoundation/0g-agenticid-sdk 0.1.6
